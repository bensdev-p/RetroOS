[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["RetroOS contributors"]
repository = "https://github.com/bensdev-p/RetroOS"

[workspace.dependencies]
retro-gfx = { path = "crates/retro-gfx" }
retro-dosfs = { path = "crates/retro-dosfs" }
retro-apps = { path = "crates/retro-apps" }
retro-ui = { path = "crates/retro-ui" }
retro-ipc = { path = "crates/retro-ipc" }
retro-kms = { path = "crates/retro-kms" }
png = "0.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.clippy]
# Drawing primitives take (x, y, w, h, colours…) by design.
too_many_arguments = "allow"
