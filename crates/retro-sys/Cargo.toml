[package]
name = "retro-sys"
description = "System services for RetroOS front-ends (network, clock, keyboard, display, startup; later sound, Bluetooth, packages) over D-Bus"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde_json = "1"
libc = "0.2"
serde = "1"

