name: CI

on:
  push:
    branches: [main, "claude/**"]
    # Notes and checklists need no image (a full run takes ~25 min).
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint, unit and host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libinput-dev libudev-dev libseat-dev libgbm-dev libdrm-dev libpixman-1-dev python3-pil \
            xwayland x11-apps libegl1 libegl-mesa0 libgl1-mesa-dri libgtk-3-bin
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Headless Station end-to-end
        run: tests/host/run-all.sh out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-test-screens
          path: out/test-host*

  bootloader:
    name: Pi 5 bootloader settings card
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools mtools fdisk zip
      - run: build/mkeeprom.sh out
      - uses: actions/upload-artifact@v4
        with:
          name: retroos-bootloader-rpi5
          path: out/bootloader/

  image:
    name: Build image and boot it in QEMU
    # Not after the check job: the image builds its own binaries, and the
    # image is uploaded as soon as it is built, before the QEMU tests.
    runs-on: ubuntu-24.04-arm
    # A normal run takes ~22 min; a stalled package server should fail the
    # run, not hold it for the six-hour default.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap dosfstools mtools e2fsprogs fdisk dpkg-dev xz-utils qemu-system-arm qemu-utils \
            libxkbcommon-dev libinput-dev libudev-dev libseat-dev libgbm-dev libdrm-dev libpixman-1-dev python3-pil
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # Debian packages from the pinned snapshot, kept between runs. Saved
      # right after the image step even when it failed, so every run keeps
      # what it managed to download (caches are immutable: one per run).
      - uses: actions/cache/restore@v4
        with:
          path: debcache
          key: debs-${{ hashFiles('build/lock/snapshot', 'build/packages/*.list') }}-${{ github.run_id }}
          restore-keys: |
            debs-${{ hashFiles('build/lock/snapshot', 'build/packages/*.list') }}-
            debs-
      - name: Build image
        id: image
        run: |
          ls debcache 2>/dev/null | wc -l > debcount.before || echo 0 > debcount.before
          sudo env "PATH=$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" RETRO_DEB_CACHE="$PWD/debcache" make image.xz
      - name: Package cache changed?
        id: debs
        if: always()
        run: |
          after=$(ls debcache 2>/dev/null | wc -l)
          echo "changed=$([ "$after" != "$(cat debcount.before 2>/dev/null)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        if: always() && steps.debs.outputs.changed == 'true'
        with:
          path: debcache
          key: debs-${{ hashFiles('build/lock/snapshot', 'build/packages/*.list') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: retroos-image
          path: |
            out/*.img.xz
            out/*.sha256
            out/manifest.txt
      - name: Boot test (QEMU)
        run: sudo env "PATH=$PATH" python3 tests/qemu/test_m1.py out
      - name: Milestone 2 test (QEMU)
        run: sudo env "PATH=$PATH" python3 tests/qemu/test_m2.py out
      - name: Milestone 3 test (QEMU)
        run: sudo env "PATH=$PATH" python3 tests/qemu/test_m3.py out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-tests
          path: |
            out/test-m1/*.png
            out/test-m1/report.json
            out/test-m1/diagnostics.txt
            out/test-m1/*.log
            out/test-m1/qemu.err
            out/test-m2/*.png
            out/test-m2/report.json
            out/test-m2/*.log
            out/test-m2/qemu.err
            out/test-m3/*.png
            out/test-m3/report.json
            out/test-m3/*.log
            out/test-m3/qemu.err
